x-app: &app
  # One image for api and worker so a single build updates both.
  image: mediaforge:dev
  build: .
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+asyncpg://mediaforge:mediaforge@postgres:5432/mediaforge
    TEST_DATABASE_URL: postgresql+asyncpg://mediaforge:mediaforge@postgres:5432/mediaforge_test
    REDIS_URL: redis://redis:6379/0
    STORAGE_ROOT: /data/media
  volumes:
    - .:/app
    - media:/data/media
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mediaforge
      POSTGRES_PASSWORD: mediaforge
      POSTGRES_DB: mediaforge
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediaforge -d mediaforge"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    <<: *app
    ports:
      - "8000:8000"
    healthcheck:
      # The slim image has no curl. uvicorn only starts after migrations succeed, so 200 implies schema is ready.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 30s

  worker:
    <<: *app
    command: ["python", "-m", "app.workers.runner"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy  # the api container applies migrations on start

volumes:
  pgdata:
  media:
