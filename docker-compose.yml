x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+asyncpg://mediaforge:mediaforge@postgres:5432/mediaforge
    TEST_DATABASE_URL: postgresql+asyncpg://mediaforge:mediaforge@postgres:5432/mediaforge_test
    REDIS_URL: redis://redis:6379/0
    STORAGE_ROOT: /data/media
  volumes:
    - .:/app
    - media:/data/media
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mediaforge
      POSTGRES_PASSWORD: mediaforge
      POSTGRES_DB: mediaforge
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediaforge -d mediaforge"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    <<: *app
    ports:
      - "8000:8000"

volumes:
  pgdata:
  media:
